name: Build RD Projector APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Accept SDK Licenses & Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          npm install
          npx cap add android
          npx cap sync android
          node scripts/patch-projector.mjs
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/RD-Stream-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: RD-Stream-TV-APK, path: release-apk/RD-Stream-TV.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RD Stream TV v1.0.0 (Projector APK)
          files: release-apk/RD-Stream-TV.apk
